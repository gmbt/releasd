<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>releasd</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f0f10">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <h2>releasd <span class="by">by gmbt</span></h2>
    <p class="hint">Enter the passphrase to open the feed.</p>
    <input name="password" type="password" autocomplete="current-password" placeholder="passphrase" required>
    <button class="btn" type="submit">log in</button>
    <p class="hint warn" id="loginErr"></p>
  </form>
</div>
<header class="top">
  <h1>releasd <span class="by">by gmbt</span></h1>
  <nav class="tabs" aria-label="Sections">
    <button type="button" class="tab active" data-tab="rinse">Rinse <span id="rinseCount" class="count"></span></button>
    <button type="button" class="tab" data-tab="bandcamp">Bandcamp <span id="bcCount" class="count"></span></button>
  </nav>
  <div class="tools">
    <label class="chk"><input type="checkbox" id="hideSeen"> hide seen</label>
    <label class="chk"><input type="checkbox" id="showUpcoming"> upcoming</label>
    <label class="chk" title="live tempo of the playing Rinse mix (experimental)"><input type="checkbox" id="bpmOn"> bpm</label>
    <span id="bpmLive" class="badge bpm" hidden></span>
    <button type="button" id="openSettings" class="btn ghost" title="GitHub sync settings">settings</button>
  </div>
</header>

<main class="cols">
  <section class="panel active" id="rinse">
    <div class="panel-head">
      <h2>Rinse FM</h2>
      <div class="panel-tools">
        <label class="chk">sort <select id="rinseSort"><option value="added">added</option><option value="aired">aired</option></select></label>
        <button type="button" class="btn ghost" data-edit="rinse">edit shows</button>
        <button type="button" class="btn ghost" data-seen="rinse">mark all seen</button>
      </div>
    </div>
    <div class="editor" id="rinseEditor" hidden></div>
    <nav class="subtabs" aria-label="Rinse sections">
      <button type="button" class="subtab active" data-rtab="feed">Feed <span id="rinseFeedCount" class="count"></span></button>
      <button type="button" class="subtab" data-rtab="saved">Saved <span id="rinseSavedCount" class="count plain"></span></button>
    </nav>
    <p class="status" id="rinseStatus">loading…</p>
    <p class="status" id="savedStatus" hidden></p>
    <ol class="items" id="rinseItems"></ol>
    <ol class="items" id="rinseSaved" hidden></ol>
  </section>

  <section class="panel" id="bandcamp">
    <div class="panel-head">
      <h2>Bandcamp</h2>
      <div class="panel-tools">
        <button type="button" class="btn ghost" id="bcRefresh" title="rebuild Bandcamp data now (~5 min)">refresh</button>
        <button type="button" class="btn ghost" data-edit="bandcamp">edit labels</button>
        <button type="button" class="btn ghost" data-seen="bandcamp">mark all seen</button>
      </div>
    </div>
    <div class="editor" id="bcEditor" hidden></div>
    <nav class="subtabs" aria-label="Bandcamp sections">
      <button type="button" class="subtab active" data-bctab="released">Released <span id="bcReleasedCount" class="count"></span></button>
      <button type="button" class="subtab" data-bctab="preorders">Pre-orders <span id="bcPreCount" class="count"></span></button>
    </nav>
    <p class="status" id="bcStatus">loading…</p>
    <ol class="items" id="bcReleased"></ol>
    <ol class="items" id="bcPre" hidden></ol>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" class="settings-form">
    <h2>Account</h2>
    <p class="hint" id="sessionInfo"></p>
    <button type="button" id="logoutBtn" class="btn ghost">log out on this device</button>
    <details><summary class="hint">advanced</summary>
      <label>API URL <input name="api" autocomplete="off" spellcheck="false"></label>
      <label>Legacy key <input name="key" autocomplete="off" spellcheck="false"></label>
    </details>
    <div class="row">
      <button value="cancel" class="btn ghost">cancel</button>
      <button value="save" class="btn">save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
